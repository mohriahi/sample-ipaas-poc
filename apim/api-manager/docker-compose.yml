services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.9}
    container_name: mysql-${WSO2AM_VERSION:-4.7.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/scripts:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/mysql.conf.d/my.cnf
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    networks:
      - ipaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD:-root} && [ -f /var/lib/mysql/initialization-complete.flag ]"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  wso2am:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile
      args:
        WSO2AM_VERSION: ${WSO2AM_VERSION:-4.7.0}
        MYSQL_CONNECTOR_VERSION: ${MYSQL_CONNECTOR_VERSION:-8.4.0}
        JMX_EXPORTER_VERSION: ${JMX_EXPORTER_VERSION:-1.6.0}
    image: wso2am-mysql:${WSO2AM_VERSION:-4.7.0}
    container_name: wso2am-${WSO2AM_VERSION:-4.7.0}
    hostname: wso2am
    labels:
      - "ipaas.logs=true"  # picked up by observability/promtail
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Exposes API Manager metrics for Prometheus on port 9797.
      # Not set through JAVA_OPTS on purpose — see dockerfile/Dockerfile.
      JMX_EXPORTER_OPTS: "-javaagent:/home/wso2carbon/jmx-exporter/jmx_prometheus_javaagent-${JMX_EXPORTER_VERSION:-1.6.0}.jar=9797:/home/wso2carbon/jmx-exporter/config.yml"
    # Startup options:
    # - enableCorrelationLogs: log every request with its correlation ID
    #   (repository/logs/correlation.log), so it can be followed end to end.
    # - correlation_header_name=traceparent: reuse the trace ID as the
    #   correlation ID, so logs and traces share the same identifier.
    # They must be passed here: set in JAVA_OPTS, they would be ignored.
    command: ["-DenableCorrelationLogs=true", "-Dcorrelation_header_name=traceparent"]
    ports:
      - "${WSO2AM_HTTPS_PORT:-9443}:9443"          # Management console / Publisher / DevPortal / Admin
      - "${WSO2AM_GATEWAY_HTTPS_PORT:-8243}:8243"  # API Gateway HTTPS
      - "${WSO2AM_GATEWAY_HTTP_PORT:-8280}:8280"   # API Gateway HTTP
      - "${WSO2AM_METRICS_PORT:-9798}:9797"        # Prometheus metrics (/metrics)
    volumes:
      - wso2am_deployment:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/deployment/server
      - ./config/deployment.toml:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/conf/deployment.toml
      - ./config/access-log.properties:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/conf/access-log.properties:ro
      # Log folder, also read by the observability stack to collect the logs.
      - wso2am_logs:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/logs
    networks:
      - ipaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "-k", "https://localhost:9443/services/Version"]
      interval: 10s
      start_period: 180s
      retries: 20

volumes:
  mysql_data:
    name: mysql_data
  wso2am_deployment:
    name: wso2am_deployment
  wso2am_logs:
    name: wso2am_logs

networks:
  ipaas-network:
    name: ${NETWORK_NAME:-ipaas-network}
    external: true
