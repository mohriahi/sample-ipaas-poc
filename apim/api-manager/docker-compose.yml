services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.9}
    container_name: mysql-${WSO2AM_VERSION:-4.7.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/scripts:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/mysql.conf.d/my.cnf
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    networks:
      - ipaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD:-root} && [ -f /var/lib/mysql/initialization-complete.flag ]"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  wso2am:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile
      args:
        WSO2AM_VERSION: ${WSO2AM_VERSION:-4.7.0}
        MYSQL_CONNECTOR_VERSION: ${MYSQL_CONNECTOR_VERSION:-8.4.0}
        JMX_EXPORTER_VERSION: ${JMX_EXPORTER_VERSION:-1.6.0}
    image: wso2am-mysql:${WSO2AM_VERSION:-4.7.0}
    container_name: wso2am-${WSO2AM_VERSION:-4.7.0}
    hostname: wso2am
    labels:
      - "ipaas.logs=true"  # picked up by observability/promtail
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Prometheus JMX exporter javaagent (see dockerfile/Dockerfile) —
      # exposes JMX MBeans as Prometheus metrics on :9797.
      JAVA_OPTS: "-javaagent:/home/wso2carbon/jmx-exporter/jmx_prometheus_javaagent-${JMX_EXPORTER_VERSION:-1.6.0}.jar=9797:/home/wso2carbon/jmx-exporter/config.yml"
    # Enables correlation logs (per-request Correlation-ID tracing across
    # method/external/DB calls) — writes to repository/logs/correlation.log
    # (file-only, additivity disabled by log4j2.properties, so NOT captured
    # by observability/promtail, which only tails stdout; see
    # ../../observability/README.md).
    # NOTE: must be passed as a bin/api-manager.sh argument, NOT via
    # JAVA_OPTS — the script itself hardcodes -DenableCorrelationLogs=false
    # later on its java command line, which would silently win over a
    # JAVA_OPTS-supplied value (found this the hard way — verified live).
    command: ["-DenableCorrelationLogs=true"]
    ports:
      - "${WSO2AM_HTTPS_PORT:-9443}:9443"          # Management console / Publisher / DevPortal / Admin
      - "${WSO2AM_GATEWAY_HTTPS_PORT:-8243}:8243"  # API Gateway HTTPS
      - "${WSO2AM_GATEWAY_HTTP_PORT:-8280}:8280"   # API Gateway HTTP
      - "${WSO2AM_METRICS_PORT:-9798}:9797"        # Prometheus metrics (/metrics)
    volumes:
      - wso2am_deployment:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/deployment/server
      - ./config/deployment.toml:/home/wso2carbon/wso2am-${WSO2AM_VERSION:-4.7.0}/repository/conf/deployment.toml
    networks:
      - ipaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "-k", "https://localhost:9443/services/Version"]
      interval: 10s
      start_period: 180s
      retries: 20

volumes:
  mysql_data:
    name: mysql_data
  wso2am_deployment:
    name: wso2am_deployment

networks:
  ipaas-network:
    name: ${NETWORK_NAME:-ipaas-network}
    external: true
