# Format of the gateway access log (repository/logs/http_access.log).
# Same as the default format, plus the request's trace / correlation ID, so
# each access log line can be linked to its trace and to the other logs.
# Docs: https://apim.docs.wso2.com/en/latest/monitoring/observability/monitoring-http-access-logs/
access_log_pattern=%{X-Forwarded-For}i %h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i" traceparent="%{traceparent}i"
