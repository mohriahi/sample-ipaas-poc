# Tempo stores the traces sent by the API gateway and hello-world, and turns
# them into metrics (requests, errors, durations) sent to Prometheus.
# Based on the official example:
# https://github.com/grafana/tempo/blob/v3.1.0/example/docker-compose/single-binary/tempo.yaml
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]
      processor:
        span_metrics:
          # Add the API name, version, HTTP method and status code to the
          # metrics, so the dashboards can break them down per API and status.
          dimension_mappings:
            - name: http_status_code
              source_labels: ["span.http.response.status.code"]
            - name: api_name
              source_labels: ["span.api.name"]
            - name: api_version
              source_labels: ["span.api.version"]
            - name: http_method
              source_labels: ["span.request.method"]
          # Ignore the traces created each time Prometheus reads hello-world's metrics.
          filter_policies:
            - exclude:
                match_type: strict
                attributes:
                  - key: resource.service.name
                    value: ballerinax_prometheus_svc_0

usage_report:
  reporting_enabled: false
