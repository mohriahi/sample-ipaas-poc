services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Receives the metrics that Tempo computes from the traces.
      - --web.enable-remote-write-receiver
      # Lets a point on a chart link to the trace behind it.
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ipaas-network
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.6.1}
    container_name: loki
    hostname: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - ipaas-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.1.0}
    container_name: tempo
    hostname: tempo
    command: -target=all -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"   # Tempo query API
      - "${OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC (wso2am, hello-world)
      - "${OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP
    depends_on:
      - prometheus
    networks:
      - ipaas-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.6.1}
    container_name: promtail
    hostname: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      # Read-only access to Docker, to find the containers labeled
      # "ipaas.logs=true" and collect their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # WSO2 API Manager log files (correlation, API, audit and access logs).
      - wso2am_logs:/var/log/wso2am:ro
    depends_on:
      - loki
    networks:
      - ipaas-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    container_name: grafana
    hostname: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ipaas-network
    restart: unless-stopped

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  loki_data:
    name: loki_data
  tempo_data:
    name: tempo_data
  wso2am_logs:
    # Created by apim/api-manager, only read here.
    name: wso2am_logs
    external: true

networks:
  ipaas-network:
    name: ${NETWORK_NAME:-ipaas-network}
    external: true
