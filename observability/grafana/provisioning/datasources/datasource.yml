apiVersion: 1

# Metrics, logs and traces are linked to each other in Grafana:
#  - a point on a chart  → its trace
#  - a log line          → its trace
#  - a trace             → its logs and metrics
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Makes the trace IDs and correlation IDs found in log lines clickable:
      # each one links to its trace and to every log line that contains it
      # (through the WSO2 Traces / Logs dashboards, filtered on that ID).
      derivedFields:
        - name: TraceID
          matcherRegex: '(?:traceId="|00-)([0-9a-f]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
        - name: Logs for this trace
          matcherRegex: '(?:traceId="|00-)([0-9a-f]{32})'
          url: '/d/wso2-logs?var-id=$${__value.raw}&from=now-24h&to=now'
        - name: Trace for this correlation ID
          matcherRegex: '(?:\||"correlationId":"|traceparent=")([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
          url: '/d/wso2-traces?var-id=$${__value.raw}&from=now-24h&to=now'
        - name: Logs for this correlation ID
          matcherRegex: '(?:\||"correlationId":"|traceparent=")([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
          url: '/d/wso2-logs?var-id=$${__value.raw}&from=now-24h&to=now'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{container=~".+"} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
