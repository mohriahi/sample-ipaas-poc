services:
  icp:
    image: wso2/wso2-integration-control-plane:${ICP_VERSION:-2.0.0}
    container_name: icp-${ICP_VERSION:-2.0.0}
    hostname: icp
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        config_volume="$$WORKING_DIRECTORY/wso2-config-volume"
        if [ -d "$$config_volume" ] && [ "$$(ls -A "$$config_volume")" ]; then
          cp -RL "$$config_volume"/* "$$WSO2_SERVER_HOME/"
        fi
        # Point the web console at the host port (not the default 9446),
        # otherwise login fails from the browser.
        public_url="https://localhost:${ICP_HTTPS_PORT:-19446}"
        toml="$$WSO2_SERVER_HOME/conf/deployment.toml"
        sed -i '/^backend\(GraphqlEndpoint\|AuthBaseUrl\|ObservabilityEndpoint\) = /d' "$$toml"
        sed -i "1i backendGraphqlEndpoint = \"$$public_url/graphql\"\nbackendAuthBaseUrl = \"$$public_url/auth\"\nbackendObservabilityEndpoint = \"$$public_url/icp/observability\"" "$$toml"
        exec bash "$$WSO2_SERVER_HOME/bin/icp.sh" run
    ports:
      - "${ICP_HTTPS_PORT:-19446}:9446"    # Console (dashboard) - HTTPS
      - "${ICP_RUNTIME_PORT:-19445}:9445"  # Runtime (Micro Integrator) registration
    volumes:
      # Keeps ICP data (embedded database) when the platform is stopped with ./stop.sh
      - icp_data:/home/wso2carbon/wso2-integration-control-plane-${ICP_VERSION:-2.0.0}/bin/database
    networks:
      - ipaas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "-k", "https://localhost:9446"]
      interval: 10s
      start_period: 60s
      retries: 20

volumes:
  icp_data:
    name: icp_data

networks:
  ipaas-network:
    name: ${NETWORK_NAME:-ipaas-network}
    external: true
