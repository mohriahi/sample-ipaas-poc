[package]
org = "demo"
name = "hello_world"
version = "0.1.0"

# Needed for hello-world to produce metrics and traces.
[build-options]
observabilityIncluded = true
# Keep the library versions locked in Dependencies.toml: newer versions
# make the tracing module crash at startup.
sticky = true

# UNCOMMENT THE BELOW LINE TO ENABLE INTEGRATION CONTROL PLANE REMOTE MANAGEMENT
#remoteManagement = true
