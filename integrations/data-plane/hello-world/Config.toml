# Exposes Prometheus-format metrics (Ballerina HTTP/runtime metrics) at
# http://<host>:9797/metrics — scraped by ../../../observability/.
[ballerina.observe]
metricsEnabled = true
metricsReporter = "prometheus"

[ballerinax.prometheus]
port = 9797
host = "0.0.0.0"

